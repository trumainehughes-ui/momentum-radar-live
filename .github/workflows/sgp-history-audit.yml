name: SGP Historical Audit Unit Tests
on:
  pull_request:
    paths:
      - 'lib/sgp-history-audit.js'
      - 'tests/sgp-history-audit.test.js'
      - '.github/workflows/sgp-history-audit.yml'
  push:
    paths:
      - 'lib/sgp-history-audit.js'
      - 'tests/sgp-history-audit.test.js'
      - '.github/workflows/sgp-history-audit.yml'
jobs:
  audit-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run SGP historical audit unit tests
        run: node --test tests/sgp-history-audit.test.js
