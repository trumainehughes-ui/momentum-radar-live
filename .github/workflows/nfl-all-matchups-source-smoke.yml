name: NFL All-Matchups Official Weekly Smoke
on:
  push:
    branches: [feat/nfl-all-matchup-weekly-injury-auto-20261010]
    paths:
      - tests/nfl-all-matchups-source-smoke.mjs
      - .github/workflows/nfl-all-matchups-source-smoke.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node tests/nfl-all-matchups-source-smoke.mjs
