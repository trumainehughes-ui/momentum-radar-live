name: Sportsbook verification tests
on:
  push:
    branches:
      - fix/sportsbook-market-verification-20261010
  pull_request:
    paths:
      - 'lib/sportsbook-market-verification.js'
      - 'lib/pregame-ai-review.js'
      - 'api/nfl-markets.js'
      - 'api/nfl-health.js'
      - 'tests/**'
      - '.github/workflows/sportsbook-verification-ci.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock
      - run: npm test
