name: NFL SGP Hotfix Regression
on:
  push:
    branches:
      - fix/nfl-sgp-tier-hotfix-20261010
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  nfl-sgp-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock
      - name: Validate API and tier helper syntax
        run: node --check api/nfl-markets.js && node --check lib/ai-mechanics/nfl-sgp-tiers.js
      - name: Run screenshot and payout boundary tests
        run: node --test tests/nfl-sgp-tier-hotfix.test.js tests/nfl-sgp-yardage-mix.test.js
      - name: Run complete application tests
        run: npm test
