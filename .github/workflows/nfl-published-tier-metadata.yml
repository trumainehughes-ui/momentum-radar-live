name: NFL Published SGP Tier Metadata
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-model-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify canonical model-tier publication and shared snapshot
        run: |
          node --check api/nfl-markets.js
          node --check lib/nfl-public-model-sgp-serializer.js
          node --test tests/nfl-published-tier-metadata.test.js tests/nfl-sgp-tier-market-parity.test.js
          node --test tests/nfl-snapshot-immutable-sync.test.js tests/public-nfl-sync-contract.test.js tests/public-book-specific-sgp-parity.test.js
