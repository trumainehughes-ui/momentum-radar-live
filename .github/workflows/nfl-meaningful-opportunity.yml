name: NFL Meaningful Opportunity Guard
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-player-opportunity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax and measured opportunity tests
        run: |
          node --check api/nfl-markets.js
          node --check lib/nfl-meaningful-opportunity.js
          node --test tests/nfl-meaningful-opportunity.test.js
          node --test tests/nfl-snapshot-immutable-sync.test.js tests/public-nfl-sync-contract.test.js
