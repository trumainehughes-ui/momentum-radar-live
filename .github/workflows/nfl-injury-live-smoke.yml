name: NFL Injury Report Live Smoke
on:
  push:
    branches:
      - fix/nfl-injury-freshness-20261010
    paths:
      - .github/workflows/nfl-injury-live-smoke.yml
      - tests/nfl-injury-live-smoke.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  min-no-injuries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/nfl-injury-live-smoke.mjs
