name: AI Mechanics Tests
on:
  push:
    branches:
      - feature/ai-mechanics-safe-rollout
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock
      - run: node --test tests/ai-mechanics.test.js tests/ai-signals.test.js tests/ai-scenarios.test.js
      - run: npm test
