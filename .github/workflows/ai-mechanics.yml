name: AI Mechanics Tests
on:
  push:
    branches:
      - feature/ai-mechanics-safe-rollout
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock
      - run: node --test tests/ai-mechanics.test.js tests/ai-signals.test.js tests/ai-scenarios.test.js tests/ai-parlay-review.test.js tests/ai-matchups.test.js tests/ai-breakout.test.js tests/ai-postgame.test.js tests/ai-evidence.test.js tests/ai-nfl-adapter.test.js tests/ai-role-evidence.test.js tests/ai-availability-overrides.test.js tests/ai-nfl-game-review.test.js tests/ai-game-scope.test.js tests/ai-sgo-adapter.test.js tests/ai-sgo-game-review.test.js tests/ai-sgo-categories.test.js tests/ai-sgo-raw-event.test.js tests/ai-sgp-display-evidence.test.js tests/ai-sgo-crosswalk.test.js tests/ai-sgo-shadow-review.test.js tests/ai-market-provenance.test.js tests/ai-market-health.test.js tests/ai-book-quote-freshness.test.js tests/ai-market-cache-policy.test.js
      - run: npm test
