name: NFL Snapshot End-to-End Contract
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate owner and public syntax
        run: |
          node --check api/nfl-markets.js
          node --check api/public-nfl-game.js
          node --check lib/nfl-sgp-snapshot-status.js
      - name: Test 90-to-60 snapshot parity, ordering and public presentation
        run: node --test tests/nfl-snapshot-immutable-sync.test.js tests/public-nfl-sync-contract.test.js
