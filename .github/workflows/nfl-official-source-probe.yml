name: NFL Injury Provider Shape Check
on:
  push:
    branches: [feat/nfl-all-matchup-weekly-injury-auto-20261010]
    paths: [tests/nfl-official-source-probe.mjs, .github/workflows/nfl-official-source-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/nfl-official-source-probe.mjs
