name: AI Integration Tests
on:
  push:
    branches: [feature/groq-ai-analysis]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock
      - run: npm test
      - run: node --check api/ai-analysis.js
      - run: node --check public-ai.js
